name: Build K-Pilot for Windows

on:
  workflow_dispatch:
  push:
    branches: [feature/kpilot-client]

jobs:
  build:
    runs-on: windows-2022
    env:
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize public source dependencies
        shell: bash
        run: |
          git submodule update --init client/afv-native
          git -C client/afv-native config submodule.extern/cpp-jwt.url https://github.com/arun11299/cpp-jwt.git
          git -C client/afv-native config submodule.extern/opus.url https://github.com/xpilot-project/opus.git
          git -C client/afv-native submodule update --init extern/cpp-jwt extern/opus
          rm -rf client/afv-native/extern/speexdsp
          git clone --depth 1 https://github.com/xiph/speexdsp.git client/afv-native/extern/speexdsp

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.2'
          arch: win64_msvc2019_64
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Run client protocol and MSFS ABI tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S client/tests -B build/kpilot-tests -G "Visual Studio 17 2022" -A x64
          cmake --build build/kpilot-tests --config Release --parallel
          ctest --test-dir build/kpilot-tests -C Release --output-on-failure

      - name: Build X-Plane plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S plugin -B build/kpilot-plugin -G "Visual Studio 17 2022" -A x64
          cmake --build build/kpilot-plugin --config Release --parallel

      - name: Build desktop client with private-network identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S client -B build/kpilot-client -G "Visual Studio 17 2022" -A x64 `
            -DVATSIM_CLIENT_ID=0 `
            -DVATSIM_CLIENT_KEY= `
            -DVATSIM_TOWERVIEW_CLIENT_ID=0 `
            -DCONFIG_ENCRYPTION_KEY=7358102469 `
            -DCMAKE_LIBRARY_PATH="${{ github.workspace }}/dependencies/platform/windows/wmf"
          cmake --build build/kpilot-client --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE\client\Resources" `
            --no-translations `
            "$env:GITHUB_WORKSPACE\build\kpilot-client\Release\K-Pilot.exe"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          New-Item -ItemType Directory -Force build/kpilot-installer | Out-Null
          & $iscc `
            "/DKPilotClientDir=$env:GITHUB_WORKSPACE\build\kpilot-client\Release" `
            "/DXPlanePluginDir=$env:GITHUB_WORKSPACE\build\kpilot-plugin\win_x64" `
            "/O$env:GITHUB_WORKSPACE\build\kpilot-installer" `
            installer/kpilot.iss

      - name: Smoke-test install, launch, and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:GITHUB_WORKSPACE\build\kpilot-installer\K-Pilot-Setup.exe"
          $installDir = "$env:RUNNER_TEMP\K-Pilot-Smoke"
          $installLog = "$env:RUNNER_TEMP\kpilot-install.log"
          Write-Host "Installing $installer to $installDir"
          $install = Start-Process $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=$installDir", '/COMPONENTS=client,msfs2024', "/LOG=$installLog"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          Write-Host "Installer completed"
          @(
            "$installDir\K-Pilot.exe",
            "$installDir\Qt6Core.dll",
            "$installDir\platforms\qwindows.dll"
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing installed file: $_" } }

          Write-Host "Running installed version check"
          $version = Start-Process "$installDir\K-Pilot.exe" -ArgumentList '--version' -PassThru
          if (-not $version.WaitForExit(30000)) {
            $version.Kill($true)
            throw "Installed client did not exit after --version"
          }
          if ($version.ExitCode -ne 0) { throw "Installed client exited with $($version.ExitCode)" }

          Write-Host "Uninstalling smoke-test installation"
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$installDir\K-Pilot.exe") { throw "Uninstall left K-Pilot.exe behind" }

      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: K-Pilot-Windows-tested
          path: |
            build/kpilot-installer/K-Pilot-Setup.exe
          if-no-files-found: error
